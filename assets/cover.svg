<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">dhcli</title>
  <desc id="desc">A terminal window running dhcli commands next to a shopping cart, with the tagline groceries from your terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a24"/>
      <stop offset="1" stop-color="#232b3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <g transform="translate(48 56)">
    <rect width="640" height="308" rx="14" fill="#0d1117" stroke="#30363d"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
    <circle cx="50" cy="24" r="7" fill="#febc2e"/>
    <circle cx="74" cy="24" r="7" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="28" y="80" fill="#7ee787">$ <tspan fill="#e6edf3">dhcli search "stella artois bak" -n 1</tspan></text>
      <text x="28" y="108" fill="#8b949e">S1975011500195900000  € 16.45  Stella Artois Bak 24 x 25 cl</text>
      <text x="28" y="150" fill="#7ee787">$ <tspan fill="#e6edf3">dhcli set S1975011500195900000=11</tspan></text>
      <text x="28" y="178" fill="#8b949e">  11 x S1975011500195900000  € 180.95  Stella Artois</text>
      <text x="28" y="220" fill="#7ee787">$ <tspan fill="#e6edf3">dhcli nutrients S2025041800851670000</tspan></text>
      <text x="28" y="248" fill="#8b949e">  Suikers: <tspan fill="#ffa657">0 g</tspan></text>
      <text x="28" y="282" fill="#7ee787">$ <tspan fill="#e6edf3">▍</tspan></text>
    </g>
  </g>

  <g transform="translate(770 92)" fill="none" stroke="#ff6b5b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H48 L84 150 H262 L300 46 H66"/>
    <path d="M96 192 H250"/>
  </g>
  <g fill="#ff6b5b">
    <circle cx="884" cy="318" r="20"/>
    <circle cx="1010" cy="318" r="20"/>
  </g>
  <g transform="translate(862 150)" fill="#ffd166">
    <rect width="40" height="52" rx="6"/>
    <rect x="52" y="-14" width="44" height="66" rx="6" fill="#7ee787"/>
    <rect x="108" y="6" width="40" height="46" rx="6" fill="#79c0ff"/>
  </g>

  <text x="770" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#e6edf3">dhcli</text>
  <text x="770" y="388" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">groceries from your terminal</text>
</svg>

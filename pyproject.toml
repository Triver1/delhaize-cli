[project]
name = "delhaize-cli"
version = "0.1.0"
description = "Search delhaize.be and edit your cart from the terminal"
requires-python = ">=3.9"

[project.scripts]
dhcli = "delhaize:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["delhaize"]
